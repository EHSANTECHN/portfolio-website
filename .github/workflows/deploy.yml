name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build --no-cache -t ehsantechn/portfolio:${{ github.run_number }} .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ehsantechn/portfolio:${{ github.run_number }}

      # Deploy on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Stop old containers
            sudo docker stop $(sudo docker ps -aq) || true

            # Remove old containers
            sudo docker rm $(sudo docker ps -aq) || true

            # Remove old images/cache
            sudo docker system prune -af || true

            # Pull latest image
            sudo docker pull ehsantechn/portfolio:${{ github.run_number }}

            # Run latest container
            sudo docker run -d \
            --name portfolio \
            -p 80:80 \
            ehsantechn/portfolio:${{ github.run_number }}
